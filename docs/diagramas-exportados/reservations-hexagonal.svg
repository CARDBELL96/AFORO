<text x="750" y="825" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18243b"><tspan x="750" dy="0">Aplicación invoca contratos; los adaptadores implementan esos contratos.</tspan><tspan x="750" dy="25.2">El dominio no importa controladores, casos de uso, drivers ni SDK externos.</tspan></text>
<text x="800" y="970" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18243b"><tspan x="800" dy="0">Línea continua: uso / invocación. Línea discontinua con triángulo: realización de interfaz.</tspan><tspan x="800" dy="26.599999999999998">Adaptadores primarios y secundarios pertenecen a infraestructura.</tspan><tspan x="800" dy="26.599999999999998">Catalog, Payments, Tickets, Access e Identity aplican la misma separación interna.</tspan></text></svg>
