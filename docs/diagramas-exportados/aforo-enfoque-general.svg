<text x="800" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#18243b"><tspan x="800" dy="0">Cada módulo tiene adaptadores propios; los módulos colaboran mediante fachadas públicas.</tspan><tspan x="800" dy="23.799999999999997">Outbox: evento persistido y worker interno recuperable entre Payments y Tickets.</tspan></text>
<text x="800" y="890" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#18243b"><tspan x="800" dy="0">Estilo: monolito modular. Enfoque interno: puertos y adaptadores en cada módulo.</tspan><tspan x="800" dy="28">Los seis módulos no son capas ni caras de un único dominio compartido.</tspan><tspan x="800" dy="28">Web implementada en modo DEMO; Studio, Access e integraciones corresponden al diseño propuesto.</tspan></text></svg>
